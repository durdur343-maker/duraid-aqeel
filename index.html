<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم علوم الأغذية والتقانات الأحيائية - نظام إدارة الموظفين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --primary-color: #2c5f2d;
            --secondary-color: #97bc62;
            --accent-color: #ffcc00;
            --dark-color: #1a3c1e;
        }
        body {
            background-color: #f0f2f5;
            padding-bottom: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        header {
            background: linear-gradient(135deg, var(--dark-color), var(--primary-color));
            color: white;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 32px;
            margin-left: 20px;
        }
        .logo-section {
            display: flex;
            align-items: center;
        }
        .department-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header-stats {
            text-align: left;
        }
        .search-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20px auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            max-width: 900px;
        }
        .search-title {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 22px;
        }
        .search-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 16px;
            text-align: right;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }
        .search-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn.print {
            background: #2196F3;
        }
        .results-section {
            margin: 30px 0;
            display: none;
        }
        .results-title {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 20px;
        }
        .employee-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border-right: 5px solid var(--secondary-color);
        }
        .employee-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
        }
        .employee-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        .employee-name {
            font-size: 22px;
            color: var(--dark-color);
            font-weight: bold;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        .detail-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            flex-wrap: wrap;
        }
        .detail-label {
            font-weight: bold;
            color: var(--primary-color);
            min-width: 140px;
        }
        .detail-value {
            color: #555;
            word-break: break-word;
        }
        /* ملفات Google Drive */
        .drive-file {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #e8f0fe;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: var(--primary-color);
        }
        .drive-file:hover {
            background: #d0e2fc;
            transform: translateX(-3px);
        }
        .drive-file i {
            font-size: 24px;
        }
        /* قسم المرفقات */
        .images-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--secondary-color);
        }
        .images-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 18px;
        }
        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .file-card {
            width: 180px;
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #eee;
        }
        .file-card:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #e8f5e8;
        }
        .file-card i {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .file-name {
            margin-top: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--dark-color);
            word-break: break-word;
        }
        .all-employees {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        .employee-mini-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .employee-mini-card {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 10px;
            border-right: 3px solid var(--secondary-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .employee-mini-card:hover {
            background: #e8f5e8;
            transform: translateX(-5px);
        }
        .no-results {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
            display: none;
        }
        .data-loading {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 10000;
            display: none;
        }
        footer {
            background: var(--dark-color);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
            .file-card {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo"><i class="fas fa-microscope"></i></div>
                    <div class="department-info">
                        <h1>قسم علوم الأغذية والتقانات الأحيائية</h1>
                        <p>نظام إدارة الموظفين والبحث العلمي</p>
                    </div>
                </div>
                <div class="header-stats">
                    <div>👥 عدد الموظفين: <span id="total-employees">0</span></div>
                    <div>🕒 آخر تحديث: <span id="last-update"></span></div>
                </div>
            </div>
        </div>
    </header>

    <div id="notification" class="notification"></div>

    <div class="container">
        <div class="search-section">
            <h2 class="search-title">🔍 نظام البحث عن الموظفين</h2>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم الموظف أو أي معلومة...">
                <button id="searchBtn" class="search-button"><i class="fas fa-search"></i> بحث</button>
                <button id="showAllBtn" class="search-button" style="background:#4a6fa5"><i class="fas fa-list"></i> عرض الجميع</button>
            </div>
            <div class="action-buttons">
                <button id="pdfBtn" class="action-btn"><i class="fas fa-file-pdf"></i> حفظ PDF</button>
                <button id="printBtn" class="action-btn print"><i class="fas fa-print"></i> طباعة</button>
            </div>
        </div>

        <div id="dataLoading" class="data-loading">
            <i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...
        </div>

        <div id="resultsSection" class="results-section">
            <h2 class="results-title">📋 نتائج البحث</h2>
            <div id="resultsCount" style="text-align:center; margin-bottom:15px;"></div>
            <div id="resultsContainer"></div>
        </div>

        <div id="allEmployeesSection" class="all-employees">
            <h2 class="results-title">👨‍👩‍👧‍👦 جميع موظفي القسم</h2>
            <div id="allEmployeesContainer" class="employee-mini-list"></div>
        </div>

        <div id="noResults" class="no-results">
            <i class="fas fa-search-minus" style="font-size:50px; color:#ccc;"></i>
            <h3>لم يتم العثور على نتائج</h3>
            <button onclick="showAllEmployees()" style="margin-top:15px; background:var(--primary-color); color:white; border:none; padding:10px 20px; border-radius:25px;">عرض جميع الموظفين</button>
        </div>
    </div>

    <footer>
        <p>قسم علوم الأغذية والتقانات الأحيائية © 2025</p>
    </footer>

    <script>
        let employeesData = [];
        let currentResults = [];

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const showAllBtn = document.getElementById('showAllBtn');
        const pdfBtn = document.getElementById('pdfBtn');
        const printBtn = document.getElementById('printBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const allEmployeesSection = document.getElementById('allEmployeesSection');
        const allEmployeesContainer = document.getElementById('allEmployeesContainer');
        const noResults = document.getElementById('noResults');
        const dataLoading = document.getElementById('dataLoading');
        const resultsCountDiv = document.getElementById('resultsCount');
        const totalSpan = document.getElementById('total-employees');
        const notificationDiv = document.getElementById('notification');

        function showNotification(msg, isError = false) {
            notificationDiv.textContent = msg;
            notificationDiv.style.backgroundColor = isError ? '#f44336' : 'var(--primary-color)';
            notificationDiv.style.display = 'block';
            setTimeout(() => notificationDiv.style.display = 'none', 3000);
        }

        // التحقق من رابط Google Drive
        function isGoogleDriveLink(text) {
            if (!text) return false;
            return text.includes('drive.google.com') || text.includes('docs.google.com');
        }

        // فتح رابط Google Drive في نافذة جديدة
        function openDriveLink(url) {
            window.open(url, '_blank');
            showNotification('📂 جاري فتح الملف...');
        }

        // جلب البيانات من Google Sheet
        async function loadData() {
            dataLoading.style.display = 'block';
            try {
                const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxuV3idtU0Tqa6hQrc6tP_0MkDCBgxz9kYGEnVQ8Xf7yXfQOQ5tRtX3_t6kO8szf1ZBeGiS4LyHacr/pub?gid=0&single=true&output=csv';
                const response = await fetch(url + '&_=' + Date.now());
                if (!response.ok) throw new Error('فشل التحميل');
                const csv = await response.text();
                parseCSV(csv);
                showNotification(`✅ تم تحميل ${employeesData.length} موظف`);
            } catch (error) {
                console.error(error);
                showNotification('⚠️ استخدام بيانات تجريبية للعرض', true);
                loadSampleData();
            }
            dataLoading.style.display = 'none';
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString('ar-SA');
        }

        function loadSampleData() {
            employeesData = [
                {
                    "الاسم الكامل": "دريد حامد محمود محمد",
                    "الرقم الوظيفي": "107826664",
                    "العنوان الوظيفي": "رئيس ملاحظين فنيين",
                    "الهيكل التنظيمي": "ذاتية القسم",
                    "المنصب": "موظف ذاتية القسم",
                    "الرقم الرمزي": "132012",
                    "الدرجة الوظيفية": "الخامسة",
                    "تاريخ المباشرة": "2016/01/11",
                    "ملاحظات": "كتب شكر عدد 4"
                }
            ];
            totalSpan.textContent = employeesData.length;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) {
                loadSampleData();
                return;
            }
            const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
            employeesData = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                const row = {};
                for (let j = 0; j < headers.length; j++) {
                    row[headers[j]] = values[j] || '';
                }
                // البحث عن حقل الاسم
                const nameField = headers.find(h => h.includes('الاسم') || h === 'Name');
                if (nameField && row[nameField] && row[nameField].trim()) {
                    employeesData.push(row);
                } else if (row[headers[4]] && row[headers[4]].trim()) {
                    employeesData.push(row);
                }
            }
            if (employeesData.length === 0) loadSampleData();
            totalSpan.textContent = employeesData.length;
        }

        // تحديد حقل الاسم (الذي سيظهر فقط في الرأس)
        function getNameField(employee) {
            const nameFields = ['الاسم الكامل', 'الاسم', 'Name', 'الموظف', 'اسم الموظف'];
            for (let field of nameFields) {
                if (employee[field] && employee[field].trim()) return field;
            }
            // إذا لم يوجد، خذ أول حقل يبدو كاسم
            const keys = Object.keys(employee);
            for (let key of keys) {
                if (key.includes('اسم') || key.includes('Name')) return key;
            }
            return keys[4] || keys[0]; // افتراضي
        }

        // تنسيق قيمة الحقل
        function formatValue(value, columnName, isNameField = false) {
            if (!value) return '';
            
            // إذا كان النص رابط Google Drive
            if (isGoogleDriveLink(value)) {
                return `
                    <div class="drive-file" onclick="openDriveLink('${value.replace(/'/g, "\\'")}')">
                        <i class="fab fa-google-drive"></i>
                        <span>📎 ${columnName}</span>
                        <i class="fas fa-external-link-alt" style="font-size:12px;"></i>
                    </div>
                `;
            }
            
            return value;
        }

        // جمع كل روابط Google Drive
        function getAllDriveFiles(employee) {
            const files = [];
            for (let key in employee) {
                const value = employee[key];
                if (value && isGoogleDriveLink(value)) {
                    files.push({ url: value, label: key });
                }
            }
            return files;
        }

        // إنشاء معرض الملفات
        function createFileGallery(files) {
            if (files.length === 0) return '';
            
            let html = '<div class="images-section"><div class="images-title"><i class="fab fa-google-drive"></i> المرفقات من Google Drive</div><div class="images-container">';
            
            files.forEach((file, idx) => {
                html += `
                    <div class="file-card" onclick="openDriveLink('${file.url.replace(/'/g, "\\'")}')">
                        <i class="fas fa-file-alt" style="font-size:48px; color:#2c5f2d;"></i>
                        <div class="file-name">📎 ${file.label || 'مستند ' + (idx+1)}</div>
                    </div>
                `;
            });
            
            html += '</div></div>';
            return html;
        }

        function createEmployeeCard(employee) {
            // تحديد حقل الاسم
            const nameField = getNameField(employee);
            const fullName = employee[nameField] || 'موظف';
            const firstLetter = fullName.charAt(0) || 'م';
            
            // الحصول على جميع الحقول (أول 19 عمود)
            const allKeys = Object.keys(employee).slice(0, 19);
            
            // فلترة الحقول: استبعاد حقل الاسم حتى لا يتكرر
            const displayKeys = allKeys.filter(key => key !== nameField);
            
            let detailsHtml = '';
            for (let key of displayKeys) {
                const value = employee[key];
                if (value && value.trim()) {
                    const formattedValue = formatValue(value, key, false);
                    detailsHtml += `
                        <div class="detail-item">
                            <span class="detail-label">${key}:</span>
                            <span class="detail-value">${formattedValue}</span>
                        </div>
                    `;
                }
            }
            
            const allFiles = getAllDriveFiles(employee);
            const galleryHtml = createFileGallery(allFiles);
            
            return `
                <div class="employee-card">
                    <div class="employee-header">
                        <div class="employee-avatar">${firstLetter}</div>
                        <div>
                            <div class="employee-name">${fullName}</div>
                        </div>
                    </div>
                    <div class="details-grid">
                        ${detailsHtml}
                    </div>
                    ${galleryHtml}
                </div>
            `;
        }

        function displayResults(results) {
            if (results.length === 0) {
                resultsSection.style.display = 'none';
                allEmployeesSection.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            resultsSection.style.display = 'block';
            allEmployeesSection.style.display = 'none';
            noResults.style.display = 'none';
            resultsCountDiv.innerHTML = `✅ تم العثور على <strong>${results.length}</strong> نتيجة`;
            resultsContainer.innerHTML = results.map(emp => createEmployeeCard(emp)).join('');
        }

        function searchEmployees() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                showNotification('الرجاء إدخال نص للبحث', true);
                return;
            }
            const results = employeesData.filter(emp => {
                for (let key in emp) {
                    if (emp[key] && emp[key].toLowerCase().includes(query)) return true;
                }
                return false;
            });
            currentResults = results;
            displayResults(results);
            if (results.length > 0) showNotification(`🔍 تم العثور على ${results.length} نتيجة`);
            else showNotification('❌ لا توجد نتائج', true);
        }

        function showAllEmployees() {
            allEmployeesSection.style.display = 'block';
            resultsSection.style.display = 'none';
            noResults.style.display = 'none';
            currentResults = employeesData;
            
            allEmployeesContainer.innerHTML = employeesData.map(emp => {
                const nameField = getNameField(emp);
                const name = emp[nameField] || 'موظف';
                const idField = Object.keys(emp).find(k => k.includes('رقم') || k.includes('وظيفي'));
                const id = idField ? emp[idField] : '';
                return `
                    <div class="employee-mini-card" onclick="quickSearch('${name.replace(/'/g, "\\'")}')">
                        <div style="font-weight:bold;">${name}</div>
                        <div style="font-size:13px; color:#666;">${id}</div>
                    </div>
                `;
            }).join('');
        }

        window.quickSearch = function(name) {
            searchInput.value = name;
            searchEmployees();
        };

        window.openDriveLink = function(url) {
            window.open(url, '_blank');
            showNotification('📂 جاري فتح الملف في علامة تبويب جديدة');
        };

        async function exportToPDF() {
            if (currentResults.length === 0) {
                showNotification('لا توجد نتائج للتصدير', true);
                return;
            }
            showNotification('📄 جاري إنشاء PDF...');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            let y = 20;
            doc.setFontSize(18);
            doc.text('قسم علوم الأغذية والتقانات الأحيائية', 105, y, { align: 'center' });
            y += 10;
            doc.setFontSize(12);
            doc.text(`نتائج البحث: ${searchInput.value || 'جميع الموظفين'}`, 105, y, { align: 'center' });
            y += 15;
            
            for (let emp of currentResults) {
                if (y > 270) { doc.addPage(); y = 20; }
                const nameField = getNameField(emp);
                const name = emp[nameField] || 'موظف';
                doc.setFontSize(14);
                doc.text(`- ${name}`, 20, y);
                y += 8;
                
                const allKeys = Object.keys(emp).slice(0, 19);
                const displayKeys = allKeys.filter(key => key !== nameField);
                
                for (let k of displayKeys) {
                    if (emp[k] && emp[k].trim() && !isGoogleDriveLink(emp[k])) {
                        doc.setFontSize(10);
                        let text = `${k}: ${emp[k]}`;
                        if (text.length > 70) text = text.substring(0, 70) + '...';
                        doc.text(text, 25, y);
                        y += 5;
                        if (y > 280) { doc.addPage(); y = 20; }
                    } else if (isGoogleDriveLink(emp[k])) {
                        doc.setFontSize(10);
                        doc.text(`${k}: [ملف مرفق على Google Drive]`, 25, y);
                        y += 5;
                    }
                }
                y += 8;
            }
            doc.save(`موظفين_${Date.now()}.pdf`);
            showNotification('✅ تم حفظ PDF');
        }

        function printResults() {
            if (currentResults.length === 0) {
                showNotification('لا توجد نتائج للطباعة', true);
                return;
            }
            const win = window.open('', '_blank');
            let html = '<html dir="rtl"><head><meta charset="UTF-8"><title>طباعة</title><style>body{font-family:Arial;padding:20px;} .card{border:1px solid #ccc;margin-bottom:20px;padding:15px;}</style></head><body>';
            html += '<h1>قسم علوم الأغذية والتقانات الأحيائية</h1><p>نتائج البحث</p>';
            for (let emp of currentResults) {
                const nameField = getNameField(emp);
                const name = emp[nameField] || 'موظف';
                html += `<div class="card"><h3>${name}</h3>`;
                
                const allKeys = Object.keys(emp).slice(0, 19);
                const displayKeys = allKeys.filter(key => key !== nameField);
                
                for (let k of displayKeys) {
                    if (emp[k] && !isGoogleDriveLink(emp[k])) {
                        html += `<p><strong>${k}:</strong> ${emp[k]}</p>`;
                    } else if (isGoogleDriveLink(emp[k])) {
                        html += `<p><strong>${k}:</strong> [ملف مرفق على Google Drive]</p>`;
                    }
                }
                html += `</div>`;
            }
            html += '</body></html>';
            win.document.write(html);
            win.document.close();
            win.print();
        }

        searchBtn.onclick = searchEmployees;
        showAllBtn.onclick = showAllEmployees;
        pdfBtn.onclick = exportToPDF;
        printBtn.onclick = printResults;
        searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchEmployees(); });

        loadData();
    </script>
</body>
</html>
